<ng-container>
  <in-table [data]="brandDatas" [pageConfig]="pageConfig" (pageChanged)="pageChange($event)"
    [listViewClass]="'d-none d-md-block'" [cardViewClass]="'d-block d-md-none'" [isLoading]="ui.isLoading"
    [shownodata]="brandDatas.length === 0 ? true : false || ui.isLoading" [inTableTranslate]="{
              'no data found': 'No Data Found' | translate,
              'items per page': 'items per page' | translate
            }">

    <in-table-column label="#">
      <ng-template #tpl let-index="rowIndex">
        {{ ( pageConfig.currentPage -1 ) * pageConfig.itemsPerPage + index + 1 }}
      </ng-template>
    </in-table-column>
    <!-- 狀態 -->
    <in-table-column  class="text-truncate ml-1 mr-1" prop="status"
    label="{{ 'status' | translate }}">
    <ng-template #tpl let-secrets="item" let-i>
      <div class="custom-control custom-switch ">
        <input type="checkbox" class="custom-control-input cursor" id="{{ 'status' + i }}"
          [(ngModel)]="secrets.status" (change)="handleStatusChange()" >
        <label class="custom-control-label"
          for="{{ 'status' + i }}">{{ (secrets.status === true ? 'effective': 'invalid') | translate | titlecase }}</label>
      </div>
    </ng-template>
  </in-table-column>
    <!-- name -->
    <in-table-column  class="text-truncate ml-1 mr-1" prop="name" label="{{ 'name' | translate }}">
    </in-table-column>
    <!-- 更新日期 -->
    <in-table-column  class="text-truncate ml-1 mr-1" prop="modifyDate"
      label="{{ 'modify time' | translate }}">
      <ng-template #tpl let-brand="item">
        {{ brand.modifyDate | date:'yyyy-MM-dd HH:mm:ss' }}
      </ng-template>
    </in-table-column>

    <in-table-column  label="{{ 'operation' | translate }}"
     >
      <ng-template #tpl let-brand="item">
        <a class="btn btn-sm text-primary" [routerLink]="brand.id">
          <i class="fas fa-edit fa-lg"></i>
        </a>
      </ng-template>
    </in-table-column>

  </in-table>
</ng-container>
