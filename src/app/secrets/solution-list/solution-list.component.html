  <i class="fas fa-spin fa-spinner fa-3x text-blue"></i>
</div> -->
<div class="bg-white">
  <div class="mb-3">
    <ng-container>
      <in-table [data]="solutionDatas"
        [listViewClass]="'d-none d-md-block'" [cardViewClass]="'d-block d-md-none'" [isLoading]="ui.isLoading"
        [shownodata]="solutionDatas.length === 0 ? true : false || ui.isLoading" [inTableTranslate]="{
                  'no data found': 'No Data Found' | translate,
                  'items per page': 'items per page' | translate
                }">

        <in-table-column label="#">
          <ng-template #tpl let-index="rowIndex">
            {{ ( pageConfig.currentPage -1 ) * pageConfig.itemsPerPage + index + 1 }}
          </ng-template>
        </in-table-column>
        <!-- 狀態 -->
        <in-table-column  class="text-truncate ml-1 mr-1" prop="status"
        label="{{ 'status' | translate }}">
        <ng-template #tpl let-secrets="item" let-i>
          <div class="custom-control custom-switch ">
            <input type="checkbox" class="custom-control-input cursor" id="{{ 'status' + i }}"
              [(ngModel)]="secrets.status" (change)="handleStatusChange()" >
            <label class="custom-control-label"
              for="{{ 'status' + i }}">{{ (secrets.status === true ? 'effective': 'invalid') | translate | titlecase }}</label>
          </div>
        </ng-template>
      </in-table-column>
        <!-- name -->
        <in-table-column  class="text-truncate ml-1 mr-1" prop="name" label="{{ 'name' | translate }}">
          <ng-template #tpl let-solution="item" let-i>
            <input class="form-control" [(ngModel)]="solution.name">
          </ng-template>
        </in-table-column>
        <!-- 更新日期 -->
        <in-table-column  class="text-truncate ml-1 mr-1" prop="modifyDate"
          label="{{ 'modify time' | translate }}">
          <ng-template #tpl let-solution="item">
            {{ solution.modifyDate | date:'yyyy-MM-dd HH:mm:ss' }}
          </ng-template>
        </in-table-column>

        <in-table-column  label="{{ 'operation' | translate }}"
         >
          <ng-template #tpl let-solution="item" let-i>
            <div class="btn btn-sm text-primary" [routerLink]="solution.id">
              <i class="fas fa-edit fa-lg"></i>
            </div>
            <button class="btn" (click)="deleteSolution(i)"><i class="fas fa-lg fa-times text-danger"></i></button>
          </ng-template>
        </in-table-column>

      </in-table>
    </ng-container>

    <div style="cursor: pointer;" (click)="addSolutionData()" class="list-group-item list-group-item-action flex-column align-items-center nonSortable" >
      <div class="d-flex w-100 justify-content-between row align-items-center">
        <p class="col-12 text-center" style="margin:0px; color:gray"><i class="fas fa-plus"></i> {{ 'add new solution' | translate | titlecase }}</p>
      </div>
    </div>
  </div>

  <div style="height: 100px; background-color: #f2f2f2;">
    <button class="btn btn-primary float-right mt-4" (click)="save()"><i
        class="fas fa-save mr-1"></i> {{ 'save' | translate | titlecase }}</button>
  </div>
</div>
