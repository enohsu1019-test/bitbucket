<div>
  <!-- loading -->
  <ng-container *ngIf="commodity.productId === ''">
    <div class="loading-img"><h1><i class="fas fa-spin fa-spinner"></i></h1></div>
  </ng-container>

  <!-------------------------- 商品內頁詳情 -------------------------->
  <app-commodity-shop-detail *ngIf="commodity.productId !== ''"
                             [commodity]="commodity"
                             [mode]="'cart'">
  </app-commodity-shop-detail>

  <!--------------------------- 購物車按鈕 --------------------------->
  <app-commodity-cart-btn></app-commodity-cart-btn>
</div>
