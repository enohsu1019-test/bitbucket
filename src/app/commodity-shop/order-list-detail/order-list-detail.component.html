<div>

  <div class="d-flex justify-content-center align-items-center h-100"
       *ngIf="ui.isLoading">
    <i class="fas fa-spin fa-spinner fa-2x"></i>
  </div>

  <div class="my-4 bg-white shadow-sm"
       *ngIf="!ui.isLoading">
    <div class="p-3 mb-4">
      <h4 class="pb-2 mb-3 border-bottom border-primary h4-border-bottom">
        {{ 'users shopping detail' | translate | titlecase }}</h4>
      <app-shopping-detail [mode]="'view'"
                           [cartFormValue]="orderDetail"></app-shopping-detail>
    </div>
    <div class="p-3">
      <h4 class="pb-2 mb-3 border-bottom border-primary h4-border-bottom">
        {{ 'shopping cart list' | translate | titlecase }}</h4>
      <app-shopping-list [mode]="'view'"
                         [orderList]="orderList"
                         [orderPriceDetail]="orderPriceDetail"></app-shopping-list>
    </div>
  </div>
</div>
