<ng-template #typeaheadItemTemplate
             let-product="item"
             let-index="index">
  <div>
    <label *ngIf="!product.notValue">{{product.brand.name + '/' + product.originalSku + '/' + product.productSku + '/' +
      product.productName}}</label>
    <label *ngIf="product.notValue">查無資料</label>
  </div>
</ng-template>

<div class="mb-3 d-flex">
  <!-- <button *ngIf="checkCanEdit()"
          type="button"
          class="btn btn-success flex-shrink-0"
          (click)="addProduct()">
    <i class="fas fa-plus"></i><span class="d-none d-sm-inline">
      {{ 'add product subscription' | translate | titlecase }}</span>
  </button> -->
  <app-add-order-product [brandId]="solutionData.brand.id"
                         [orderHeader]="orderHeader"
                         (addEvent)="addProduct($event)"
                         [dealer]="dealer"
                         [endUserName]="endUserName">
  </app-add-order-product>
</div>
<div></div>
<div class="card"
     style="border-top: none">
  <div class="card-body">
    <div style="max-height: 500px; overflow-y: auto;">
      <in-table [data]="intableDatas"
                [listViewClass]="'d-none d-md-block'"
                [cardViewClass]="'d-block d-md-none'"
                [listHeaderClass]="'sticky-header-color'"
                [shownodata]="intableDatas.length === 0 ? true : false"
                [enableHorizontalScroll]="true"
                [config]="intableConfig"
                [inTableTranslate]="{
                        'no data found': 'No Data Found' | translate,
                        'items per page': 'items per page' | translate
                      }"
                #inTable>
        <in-table-column [styleColumn]="{'min-width': '50px'}"
                         classValue="text-wrap"
                         label="#">
          <ng-template #tpl
                       let-index="rowIndex"
                       let-xxx
                       let-brand="item">
            {{ index + 1}}
            <div style="height:25px;"
                 *ngIf="!brand.value"></div>
          </ng-template>
        </in-table-column>



        <!-- 名稱 -->
        <in-table-column [styleColumn]="{'min-width': '200px'}"
                         class="text-truncate ml-1 mr-1 "
                         prop="name"
                         label="{{ 'name' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input *ngIf="checkCanEdit() || product.id === ''"
                   type="text"
                   autocomplete="off"
                   class="form-control p-1 m-0 test inputBorder"
                   container="body"
                   [(ngModel)]="product.name"
                   [typeahead]="searchProductName(i)"
                   [typeaheadAsync]="true"
                   [typeaheadItemTemplate]="typeaheadItemTemplate"
                   [typeaheadOptionsLimit]="10"
                   [typeaheadWaitMs]="1000"
                   [typeaheadMinLength]="2"
                   [typeaheadOptionsInScrollableView]="10"
                   [typeaheadScrollable]="true"
                   (typeaheadOnSelect)="setPoNumber($event, i)">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>

        <!-- 料號 -->
        <in-table-column [styleColumn]="{'min-width': '150px'}"
                         class="text-truncate ml-1 mr-1 "
                         prop="originalSku"
                         label="原廠{{ 'part no' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <!-- <input class="form-control" type="text" [(ngModel)]="product.partNo"> -->
            <label [popover]="product.originalSku"
                   triggers="mouseenter:mouseleave"
                   placement="top"
                   *ngIf="!checkCanEdit() && product.id !== ''">{{product.originalSkuName}}</label>

            <input type="text"
                   autocomplete="off"
                   class="form-control p-1 m-0 test inputBorder"
                   container="body"
                   [(ngModel)]="product.originalSkuName"
                   [typeahead]="autoComFigSet(i)"
                   [typeaheadAsync]="true"
                   [typeaheadItemTemplate]="typeaheadItemTemplate"
                   [typeaheadOptionsLimit]="10"
                   [typeaheadWaitMs]="1000"
                   [typeaheadMinLength]="2"
                   [typeaheadOptionsInScrollableView]="10"
                   [typeaheadScrollable]="true"
                   (typeaheadOnSelect)="setPoNumber($event, i)"
                   *ngIf="checkCanEdit() || product.id === '' || checkProductType(product.category, 'originalSku')">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
              <p class="help-block text-danger"
                 *ngIf="!product.originalSku && status !== 'DRAFT'">請輸入並選擇資料
              </p>
            </div>
          </ng-template>
        </in-table-column>

        <!-- 計價類別 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '150px'}"
                         prop="extra"
                         label="{{ 'commodity category' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <!-- <label>{{product.category | translate}}</label> -->
            <select class="custom-select pt-2"
                    [(ngModel)]="product.category"
                    [disabled]="!checkCanEdit()">
              <option *ngFor="let category of categoryDropdown"
                      [disabled]="category.disabled"
                      [ngValue]="category.value">{{ category.name |
                translate}}
            </select>
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>

        <!-- order Id -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '150px'}"
                         prop="extra"
                         label="{{ 'orderId' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-control"
                   [(ngModel)]="product.extra.orderId"
                   [disabled]="!checkCanEdit()"
                   (change)="handleRequired()">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>

        <!-- 呈現名稱 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '200px'}"
                         prop="showName"
                         label="{{ 'show name' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-control"
                   type="text"
                   [(ngModel)]="product.showName"
                   [disabled]="!checkCanEdit()"
                   *ngIf="checkProductType(product.category, 'showName')">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>




        <!-- 計價單位 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '150px'}"
                         prop="unit"
                         label="{{ 'sales unit' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <!-- <label>{{product.unit}}</label> -->
            <input class="form-control"
                   type="text"
                   [(ngModel)]="product.unit"
                   [disabled]="!checkCanEdit()"
                   *ngIf="checkProductType(product.category, 'unit')">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>

        <!-- ERP料號 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '150px'}"
                         prop="erpNumber"
                         label="{{ 'erp serial number' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-control"
                   *ngIf="checkProductType(product.category, 'erpNumber')"
                   type="text"
                   [(ngModel)]="product.erpNumber"
                   [disabled]="!checkCanEdit()">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>

        <!-- 單位描述 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '150px'}"
                         prop="unitDescription"
                         label="{{ 'unit desc' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-control"
                   type="text"
                   [(ngModel)]="product.unitDescription"
                   [disabled]="!checkCanEdit()"
                   *ngIf="checkProductType(product.category, 'unitDescription')">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>

        <!-- 用量上限級距 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '150px'}"
                         prop="tierEnd"
                         label="{{ 'usage upper limit' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-control"
                   type="number"
                   [(ngModel)]="product.tierEnd"
                   [disabled]="!checkCanEdit()"
                   (change)="handleRequired()"
                   *ngIf="checkProductType(product.category,'tierEnd')">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>

        <!-- 下單成本 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '100px'}"
                         prop="originalPrice"
                         label="{{ 'order cost' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-control"
                   type="number"
                   [(ngModel)]="product.originalPrice"
                   [disabled]="!checkCanEdit()"
                   (change)="calculationAkami(product); handleRequired()"
                   *ngIf="checkProductType(product.category, 'originalPrice')">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>

        <!-- 售價 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '150px'}"
                         prop="sellingPrice"
                         label="{{ 'sell' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-control"
                   type="number"
                   [(ngModel)]="product.sellingPrice"
                   [disabled]="!checkCanEdit()"
                   (change)="handleRequired()"
                   *ngIf="checkProductType(product.category, 'sellingPrice')">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
              <p class="help-block text-danger"
                 *ngIf="!product.sellingPrice && status !== 'DRAFT' && product.category === 'EXPENSE'">{{ '此欄位必填且價格不能為零'
                | translate }}
              </p>
            </div>
          </ng-template>
        </in-table-column>

        <!-- 最低消費 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '200px'}"
                         prop="minimum"
                         label="{{ 'minimum consumption' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-control"
                   [(ngModel)]="product.minimum"
                   [disabled]="!checkCanEdit()"
                   (change)="handleRequired()"
                   *ngIf="checkProductType(product.category,'minimum')">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
              <!-- <p class="help-block text-danger" *ngIf="!product.minimum">{{ 'this field is required' | translate }}</p> -->
            </div>
          </ng-template>
        </in-table-column>

        <!-- 計價週期 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '150px'}"
                         prop="leaseMode"
                         label="{{ 'pricing cycle' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <!-- <label>{{product.leaseModeName | translate}}</label> -->
            <select class="custom-select pt-2"
                    [(ngModel)]="product.leaseMode"
                    [disabled]="!checkCanEdit()"
                    *ngIf="checkProductType(product.category, 'leaseMode')">
              <option *ngFor="let leaseMode of leaseModeDropdown"
                      [ngValue]="leaseMode.value">{{ leaseMode.name |
                translate}}
            </select>
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>

        <!-- 隱藏用量摘要 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '100px'}"
                         prop="extra"
                         label="{{ 'hidden usage' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-check"
                   type="checkbox"
                   [(ngModel)]="product.extra.hiddenUsage"
                   [disabled]="!checkCanEdit()"
                   (change)="handleRequired()"
                   *ngIf="checkProductType(product.category, 'hiddenUsage')">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>

        <!-- 成本幣別 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '100px'}"
                         prop="originalCurrency"
                         label="{{ 'cost currency' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <label>{{product.originalCurrency | translate}}</label>
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>


        <!-- 數量 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '100px'}"
                         prop="quantity"
                         label="{{ 'quantity' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-control"
                   type="number"
                   [(ngModel)]="product.quantity"
                   [disabled]="!checkCanEdit()"
                   *ngIf="checkProductType(product.category, 'quantity')"
                   (change)="calculationFunc(product); calculateTotal(product); handleRequired()">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
              <p class="help-block text-danger"
                 *ngIf="!product.quantity && status !== 'DRAFT'">{{ 'this field is required' | translate }}
              </p>
            </div>
          </ng-template>
        </in-table-column>

        <!-- 時間 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '100px'}"
                         prop="time"
                         label="{{ 'time' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-control"
                   type="number"
                   [(ngModel)]="product.times"
                   [disabled]="!checkCanEdit()"
                   (change)="calculationFunc(product)"
                   *ngIf="checkProductType(product.category, 'times')">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
              <p class="help-block text-danger"
                 *ngIf="!product.times && status !== 'DRAFT'">{{ 'this field is required' | translate }}
              </p>
            </div>
          </ng-template>
        </in-table-column>

        <!-- 售價計算方式 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '150px'}"
                         prop="calculateMethod"
                         label="{{ 'price calculation method' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <select class="custom-select pt-2"
                    [(ngModel)]="product.calculateMethod"
                    [disabled]="!checkCanEdit()"
                    (change)="calculationFunc(product);handleRequired()"
                    *ngIf="checkProductType(product.category, 'calculateMethod')">
              <option disabled
                      [ngValue]="''">請選擇售價計算方式</option>
              <option *ngFor="let calculation of calculationDropdown"
                      [ngValue]="calculation.value">{{
                calculation.name | translate}}</option>
            </select>
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
              <p class="help-block text-danger"
                 *ngIf="!product.calculateMethod && status !== 'DRAFT' && product.category === 'EXPENSE'">{{ 'this field is required' | translate }}
              </p>
            </div>
          </ng-template>
        </in-table-column>

        <!-- 費用計算方式 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '150px'}"
                         prop="billingMethod"
                         label="{{ 'billing method' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <select class="custom-select pt-2"
                    [(ngModel)]="product.billingMethod"
                    *ngIf="checkProductType(product.category, 'billingMethod')"
                    [disabled]="!checkCanEdit() || product.category !== 'EXPENSE'">
              <option [ngValue]="''"
                      [disabled]="product.category === 'EXPENSE'">{{ 'no extra charge' | translate }}</option>
              <option *ngFor="let billingMethod of billingMethodDropdown"
                      [ngValue]="billingMethod.value">{{
                billingMethod.name | translate}}</option>
            </select>
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>






        <!-- 原廠定價 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '100px'}"
                         prop="listPrice"
                         label="{{'vendor' | translate}}{{ 'list price' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-control"
                   [(ngModel)]="product.listPrice"
                   type="number"
                   [disabled]="true"
                   (change)="handleRequired()"
                   *ngIf="checkProductType(product.category, 'listPrice')">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>

        <!-- 台幣定價 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '100px'}"
                         prop="twdListPrice"
                         label="{{ 'twd list price' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-control"
                   [(ngModel)]="product.twdListPrice"
                   type="number"
                   [disabled]="true"
                   (change)="handleRequired()"
                   *ngIf="checkProductType(product.category, 'twdListPrice')">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>


        <!-- 乘數 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '100px'}"
                         prop="multiplier"
                         label="{{ 'multiplier' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-control"
                   [(ngModel)]="product.multiplier"
                   [disabled]="!checkCanEdit()"
                   type="number"
                   *ngIf="checkProductType(product.category, 'multiplier')"
                   (change)="calculationFunc(product); handleRequired()">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
              <p class="help-block text-danger"
                 *ngIf="!product.multiplier && status !== 'DRAFT'">{{ 'this field is required' | translate }}
              </p>
            </div>
          </ng-template>
        </in-table-column>





        <!-- 啟用日 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '130px'}"
                         prop="startDate"
                         label="{{ 'enable date' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <input class="form-control"
                   #dp="bsDatepicker"
                   bsDatepicker
                   *ngIf="checkProductType(product.category, 'startDate')"
                   [(ngModel)]="product.startDate"
                   (ngModelChange)="handleStartDate($event,i);calculateEndDate(product)"
                   [bsConfig]="{ dateInputFormat: 'YYYY-MM-DD'}"
                   autocomplete="off"
                   [disabled]="!checkCanEdit()">
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
              <p class="help-block text-danger"
                 *ngIf="!product.startDate && status !== 'DRAFT' && product.category === 'EXPENSE' ">{{ 'this field is required' | translate }}
              </p>
            </div>
          </ng-template>
        </in-table-column>

        <!-- 到期日 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '100px'}"
                         prop="endDate"
                         label="{{ 'expiry date' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <label *ngIf="checkProductType(product.category, 'endDate')">{{product.endDate | translate}}</label>

            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>

        <!-- 試算金額 -->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         [styleColumn]="{'min-width': '80px'}"
                         prop="total"
                         label="{{ 'trial amount' | translate }}">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <label *ngIf="checkProductType(product.category, 'total')">{{product.total}}</label>
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>
        <!-- 動作-->
        <in-table-column class="text-truncate ml-1 mr-1 "
                         label="{{ 'operation' | translate }}"
                         *ngIf="checkCanEdit()">
          <ng-template #tpl
                       let-product="item"
                       let-i>
            <div class="d-flex align-items-center m-0"
                 style="height: 80px;">
              <i class="fas fa-lg fa-times text-danger"
                 [popover]="'刪除'"
                 triggers="mouseenter:mouseleave"
                 placement="top"
                 style="cursor: pointer;"
                 (click)="deleteProduct(i,product)"></i>
            </div>
            <div style="height:25px;"
                 *ngIf="itemRequired(product)">
            </div>
          </ng-template>
        </in-table-column>

      </in-table>
    </div>

  </div>
</div>
