<div class="right-drawer-h100">

  <!-- //////////////// modal header //////////////// -->
  <div class="modal-header bg-primary align-items-center">
    <h4 class="modal-title pull-left text-white">
      {{ 'authorization' | translate | titlecase }}{{ 'setting' | translate | titlecase }}
    </h4>
    <button type="button"
            class="close pull-right"
            (click)="bsModalRef.hide()">

    </button>
  </div>

  <!-- ///////////////// modal body ///////////////// -->
  <div class="modal-body p-4">
    {{roleId}}
  </div>

</div>
