<div class="card md-4">
  <div class="card-body">

    <div class="form-group row">
      <div class="col-12"><h4>{{ 'service setting' | translate | titlecase }}</h4></div>
      <div class="col-3">
        <form [formGroup]="inputForm">
          <select class="form-control required"
                  id="serverName"
                  formControlName="serverName">
            <option selected
                    value="">{{ 'please select service name' | translate | titlecase }}</option>
            <option *ngFor="let opt of serverList"
                    [value]="opt">{{ opt }}</option>
         </select>
        </form>
      </div>
      <div>
        <button class="btn btn-success mb-3"
                (click)="addServer()"
                [disabled]="getValidator('serverName') || loading">
          <i class="fas fa-plus"></i> {{ 'add' | translate | titlecase }}
        </button>
      </div>
      <div class="col-12">
        <in-table [data]="costList"
                  [listViewClass]="'d-none d-md-block'"
                  [cardViewClass]="'d-block d-md-none'"
                  [listHeaderClass]="'sticky-header-color'"
                  [isLoading]="loading"
                  [shownodata]="costList.length === 0 ? true : false"
                  [config]="inTableConfig"
                  [inTableTranslate]="{
                    'no data found': 'no data found' | translate | titlecase,
                    'items per page': 'items per page' | translate | titlecase
                  }">

          <!-- 編號 -->
          <in-table-column [styleColumn]="{'max-width': '10%'}" label="#" class="mt-3 h-100">
            <ng-template #tpl
                         let-index="rowIndex"
                         let-xxx>
              {{ ( pageConfig.currentPage -1 ) * pageConfig.itemsPerPage + index + 1 }}
            </ng-template>
          </in-table-column>

          <!-- 服務項目 -->
          <in-table-column [styleColumn]="{'max-width': '20%'}"
                           class="text-truncate ml-1 mr-1 mt-3 h-100"
                           prop="name"
                           label="{{ 'service name' | translate }}">
          </in-table-column>

          <!-- 專案項目 -->
          <in-table-column [styleColumn]="{'max-width': '60%'}"
                           class="text-truncate ml-1 mr-1"
                           prop="projectInfo">
            <ng-template #tpl
                         let-project="item"
                         let-i>
              <!-- 編輯模式 -->
              <ng-container *ngIf="project.edit">
                <div>
                  <div class="form-control text-center text-danger" style="border: 0px;">{{ 'unallocated percentage' | translate }}：{{ getPercentage(i) }}%</div>
                  <div *ngFor="let list of afterEditCostList[i].projectInfo; let x = index" class="row ml-3">
                    <select *ngIf="list.projectManagementId !== this.otherId"
                            class="form-control col-md-3 mr-2"
                            [(ngModel)]="list.projectManagementId"
                            [ngModelOptions]="{standalone: true}"
                            (change)="editSelectProject(i, x)">
                      <option *ngFor="let option of projectList"
                              [value]="option?.id">{{ option.name | translate }}</option>
                    </select>
                    <input *ngIf="list.projectManagementId !== this.otherId"
                           class="form-control col-md-2 mr-2"
                           [(ngModel)]="list.costPercentage"
                           [ngModelOptions]="{standalone: true}">
                    <p *ngIf="list.projectManagementId !== this.otherId" class="mt-2">%</p>
                  </div>
                </div>
                <div style="height: 30px;border: 0px;"></div>
              </ng-container>

              <!-- 檢視模式 -->
              <ng-container *ngIf="!project.edit">
                <div class="row">
                  <div *ngFor="let list of project.projectInfo" class="ml-3 mb-1">
                    <div class="btn bg-primary text-white">
                      <span *ngIf="list.name === ''">{{ '其他' }}</span>
                      <span *ngIf="list.name !== ''">{{ list.name }}</span>
                      ({{ list.costPercentage }}%)
                    </div>
                  </div>
                </div>
              </ng-container>
            </ng-template>
          </in-table-column>

          <!-- 動作 -->
          <in-table-column [styleColumn]="{'max-width': '10%'}"
                           class="text-truncate ml-1 mr-1 h-100"
                           label="{{ 'action' | translate }}">
            <ng-template #tpl
                         let-contact="item"
                         let-i>
              <!-- 編輯模式 -->
              <ng-container *ngIf="contact.edit">
                <!-- 新增 -->
                <button class="btn btn-success"
                        (click)="addProject(i)">
                  <i class="fas fa-plus"></i> {{ 'add' | translate | titlecase }}
                </button>
                <!-- 刪除 -->
                <div *ngFor="let list of afterEditCostList[i].projectInfo; let x = index"
                     class="m-2"
                     [ngClass]="{'cancleIcon': list.projectManagementId !== this.otherId}">
                  <a *ngIf="list.projectManagementId !== this.otherId"
                     (click)="delProject(i, x)">
                    <i class="fas fa-times fa-lg text-danger"></i>
                  </a>
                </div>
                <div style="position: absolute; right: 0; bottom: 0;">
                  <!-- 確定 -->
                  <button class="btn btn-primary ml-3"
                          (click)="editProject(i)"
                          [disabled]="getPercentage(i) < 0 || saveLoading">
                    {{ 'save' | translate | titlecase }}
                  </button>
                  <!-- 取消 -->
                  <button class="btn btn-secondary ml-3"
                          (click)="contact.edit = !contact.edit">
                    {{ 'cancel' | translate | titlecase }}
                  </button>
                </div>
              </ng-container>

              <!-- 檢視模式 -->
              <ng-container *ngIf="!contact.edit">
                <!-- 編輯 -->
                <a class="btn btn-sm"
                  (click)="showEdit(i)">
                  <i class="fas fa-fw fa-edit fa-lg text-primary"></i>
                </a>
                <!-- 刪除 -->
                <a class="btn btn-sm"
                  (click)="delServer(i)">
                  <i class="fas fa-times fa-lg text-danger"></i>
                </a>
              </ng-container>
            </ng-template>
          </in-table-column>

        </in-table>
    </div>

    </div> <!-- form-group -->
  </div> <!-- card-body -->

</div>
