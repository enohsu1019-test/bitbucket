<div>
  <div class="card mb-2">
    <div class="card-body">

      <div class="form-group row">
        <!-- 方案 -->
        <div class="col-4">
          <label class="col-form-label">{{ 'solution' | translate }}</label>
          <!-- <p style="font-size: 24px;" *ngIf="solutionName"> {{solutionName}}</p> -->
          <input type="text" class="form-control" [(ngModel)]="solutionDatas.name">
        </div>

        <!-- 狀態 -->
        <div class="col-4">
          <label>{{ 'status' | translate }}</label>
          <div class="custom-control custom-switch ">
            <input type="checkbox" class="custom-control-input" id="{{ 'status'}}"
              (change)="filterStatus ? filterStatus = 0 : filterStatus = 1;" [checked]="filterStatus">
            <label class="custom-control-label" for="{{ 'status'}}">{{ (filterStatus === 1 ? 'effective': 'invalid') |
              translate | titlecase }}</label>
          </div>
        </div>
      </div> <!-- form-group -->

    </div> <!-- card-body -->
  </div> <!-- card -->

    <mat-tab label="{{'script management' | translate}}">
      <div class="card">
        <app-upload-script [brandId]="brandId" [solutionId]="solutionId"></app-upload-script>
      </div>
    </mat-tab>

  <div class="card-footer z-index " style="background-color: rgb(241 239 239);">
    <div class="text-right">
      <a class="btn btn-light btn-lg" [routerLink]="mode === 'add' ? '../../' : '../../'" class="btn btn-secondary">
        <i class="fas fa-undo"></i>
        {{'back to last page' | translate}}
      </a>
      <button class="btn btn-primary m-2" (click)="saveBrandApi()">
